name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno task check
      # rustup on the runner installs the wasm32 target from wasm/rust-toolchain.toml.
      - run: deno task test:wasm
      - run: deno task test
      - run: deno task build
      - run: deno task test:browser
